<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Classwork</title>
<link rel="stylesheet" href="../src/content.css">
<style>
  body { font-family: Arial, sans-serif; margin: 0; padding: 0; }
  main { max-width: 720px; margin: 0 auto; padding: 16px; }
  .tabs { display: flex; gap: 8px; padding: 8px 16px; border-bottom: 1px solid #dadce0; }
  .tabs [role="tab"] { padding: 8px 12px; border: 0; background: none; font: inherit; }
  .posts { display: flex; flex-direction: column; row-gap: 8px; margin: 0; padding: 0; list-style: none; }
  .post { height: 60px; background: #f1f3f4; border-radius: 8px; }
  .post a { display: block; line-height: 60px; padding: 0 12px; color: #1a73e8; }
  .archived-banner { background: #fff4e5; border: 1px solid #f2b879; border-radius: 8px; padding: 10px 12px; margin-bottom: 12px; }
  #results { white-space: pre-wrap; font-family: monospace; padding: 16px; font-size: 14px; }
</style>
</head>
<body>
<!-- Archived classes have their own chrome: a tab strip with no selected tab,
     no /t/ route on this fixture, and a banner instead of the usual header. -->
<div class="tabs" role="tablist">
  <button role="tab" aria-selected="false">Stream</button>
  <button role="tab" aria-selected="false">Classwork</button>
  <button role="tab" aria-selected="false">People</button>
</div>
<main role="main">
  <div class="archived-banner">This class is archived</div>
  <div style="display: flex; justify-content: flex-end; margin-bottom: 12px;">
    <button id="google-collapse-all" type="button" aria-label="Collapse all topics">Collapse all</button>
  </div>
  <section id="archived-topic">
    <h2>Archived Topic</h2>
    <ol class="posts" id="archived-list" role="list"></ol>
  </section>
</main>
<div id="results">pending</div>
<script>
  const list = document.getElementById('archived-list');
  for (let i = 1; i <= 8; i++) {
    const li = document.createElement('li');
    li.className = 'post';
    li.setAttribute('role', 'listitem');
    li.innerHTML = '<a href="https://classroom.google.com/c/123/a/900' + i + '/details">Archived post ' + i + '</a>';
    list.appendChild(li);
  }
</script>
<script src="../src/content.js"></script>
<script>
(function () {
  const lines = [];
  const ok = (name, cond, detail) => lines.push(`${cond ? 'PASS' : 'FAIL'} ${name}${detail ? ' — ' + detail : ''}`);
  const wait = (ms) => new Promise((r) => setTimeout(r, ms));
  const waitFor = async (cond, timeout = 8000) => {
    const start = Date.now();
    while (Date.now() - start < timeout) {
      if (cond()) return true;
      await wait(50);
    }
    return cond();
  };

  async function run() {
    const api = window.__classroomPlusPlus;
    ok('test hook exposed', !!api);

    const list = document.getElementById('archived-list');
    await waitFor(() => list.classList.contains('cpp-scroll-window'));
    await wait(200);

    // 1. An archived class is recognised as Classwork even though it has no
    // topics yet, no selected tab and no /t/ route in this fixture.
    ok('archived class is recognised as Classwork', api.isClassworkView() === true);
    ok('no topics are required', document.querySelectorAll('[data-topic-id]').length === 0);

    // 2. The layout is applied.
    ok('archived topic becomes a scroll window', list.classList.contains('cpp-scroll-window'),
      `class="${list.className}"`);
    ok('archived topic window is roughly five posts tall',
      Math.abs(list.clientHeight - (5 * 60 + 4 * 8)) <= 3,
      `height=${list.clientHeight}`);
    ok('archived topic gets a View all toggle', !!document.querySelector('.cpp-toggle'));
    ok('archived class gets the Reverse order button', !!document.getElementById('cpp-sort-toggle'));

    // 3. Switching away and back keeps the class laid out.
    const main = document.querySelector('main');
    main.style.display = 'none';
    api.scan();
    await wait(200);
    ok('no Classroom++ control is visible once the class is left',
      Array.from(document.querySelectorAll('.cpp-toggle, #cpp-sort-toggle'))
        .every((el) => !el.getClientRects().length));
    ok('the parked class keeps its scroll window', list.classList.contains('cpp-scroll-window'));
    main.style.display = '';
    await waitFor(() => !!document.getElementById('cpp-sort-toggle'));
    ok('returning to the archived class restores its button', !!document.getElementById('cpp-sort-toggle'));

    const failed = lines.filter((l) => l.startsWith('FAIL')).length;
    lines.push(failed === 0 ? 'ALL TESTS PASSED' : `${failed} TEST(S) FAILED`);
    document.getElementById('results').textContent = lines.join('\n');
  }

  if (document.readyState === 'complete') setTimeout(run, 400);
  else window.addEventListener('load', () => setTimeout(run, 400));
})();
</script>
</body>
</html>
